name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install JSHint
        run: npm install -g jshint

      - name: Run Linter
        run: jshint app.js models/db.js routes/giftRoutes.js routes/searchRoutes.js routes/authRoutes.js

      - name: Check syntax
        run: |
          node --check app.js
          node --check models/db.js
          node --check routes/giftRoutes.js
          node --check routes/searchRoutes.js
          node --check routes/authRoutes.js
          echo "All backend files passed syntax check"

      - name: Verify seed data
        run: |
          COUNT=$(node -e "console.log(JSON.parse(require('fs').readFileSync('util/import-mongo/gifts.json')).docs.length)")
          echo "Gift count: $COUNT"
          if [ "$COUNT" -ne 16 ]; then
            echo "Expected 16 gifts, found $COUNT"
            exit 1
          fi
          echo "Seed data verified"

      - name: Complete job
        run: echo "CI/CD pipeline completed successfully"
